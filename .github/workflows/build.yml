name: Build & Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Universal App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the newest full (non-beta) Xcode on the runner.
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1 || true)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version || true
          swift --version

      - name: Package Universal App
        run: ./scripts/package-release-app.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotchCraft-macOS
          path: |
            dist/NotchCraft-macOS.dmg
            dist/NotchCraft-macOS.zip
          retention-days: 14
