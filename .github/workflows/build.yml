name: Build & Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Universal App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build Release
        run: swift build -c release

      - name: Package Universal App
        run: ./scripts/package-release-app.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotchCraft-macOS
          path: |
            dist/NotchCraft-macOS.dmg
            dist/NotchCraft-macOS.zip
          retention-days: 14
